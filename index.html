<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1f66d6"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Nội kiểm"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧪%3C/text%3E%3C/svg%3E">
<title>Nội kiểm xét nghiệm</title>
<style>
:root{--ev:#7a4fd1;--bg:#f5f6f8;--card:#fff;--ink:#1c2430;--mute:#667085;--line:#e2e6ed;--accent:#1f66d6;--ok:#1a7f5a;--warn:#b86e00;--fail:#c62f3d;--band:#eaf3ff;--band2:#fff6e2;--grid:#9aa4b2;--soft:#f0f2f6}
@media(prefers-color-scheme:dark){:root{--ev:#b79bff;--bg:#12161c;--card:#1a2029;--ink:#e6eaf0;--mute:#9aa4b2;--line:#2b3441;--accent:#6aa9ff;--ok:#4cc38a;--warn:#e8b04a;--fail:#ff6b78;--band:#1c2c44;--band2:#3a2f12;--grid:#5d6879;--soft:#222a35}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;flex:1}
.app{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:16px;max-width:1280px;margin:0 auto}
@media(max-width:820px){.app{grid-template-columns:1fr;padding:12px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.muted,small.muted{color:var(--mute)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:7px}
button:hover{background:var(--soft)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri:hover{filter:brightness(1.08)}
button.danger{color:var(--fail)}
button.sm{padding:2px 8px;font-size:13px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%}
textarea{resize:vertical}
label.fld{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute)}
label.fld input,label.fld select{color:var(--ink);font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 140px}
.side .dev{margin-bottom:14px}
.side .dev h3{margin:0 0 4px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.side .t{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer}
.side .t:hover{background:var(--soft)}
.side .t.on{background:var(--band);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--grid);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.fail{background:var(--fail)}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute);background:var(--soft)}
.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.fail{color:var(--fail)}
.alert{border-left:4px solid var(--warn);background:var(--band2);padding:10px 12px;border-radius:7px;margin-bottom:14px}
.alert.fail{border-color:var(--fail)}.alert.okk{border-color:var(--ok);background:var(--soft)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap}
.scroll{overflow-x:auto}
h2{font-size:16px;margin:0 0 8px}
.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.head h2{font-size:20px;margin:0}
.spacer{flex:1}
svg.chart{width:100%;height:auto;display:block}
svg .band{fill:var(--band)}svg .band2{fill:var(--band2)}
svg .l0{stroke:var(--ink);stroke-width:1.4}
svg .l1{stroke:var(--grid);stroke-width:1;stroke-dasharray:2 4}
svg .l2{stroke:var(--warn);stroke-width:1;stroke-dasharray:6 4}
svg .l3{stroke:var(--fail);stroke-width:1.2}
svg .tk{fill:var(--mute);font-size:11px}
svg .ln{fill:none;stroke:var(--accent);stroke-width:1.5;opacity:.8}
svg .okp{fill:var(--accent)}svg .wp{fill:var(--warn)}svg .fp{fill:var(--fail)}svg .evl{stroke:var(--ev);stroke-width:1.4;stroke-dasharray:3 3}svg .evt{fill:var(--ev);font-size:10px;font-weight:700}.evrow td{background:var(--soft)}.evrow b{color:var(--ev)}ul.adv{margin:4px 0 10px;padding-left:20px}ul.adv li{margin:3px 0}.advbox{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px}.advbox h4{margin:0 0 4px;font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:4px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:50%;vertical-align:middle}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:0;width:min(720px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .mh{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
dialog .mb{padding:14px 16px;overflow:auto;max-height:68vh}
dialog .mf{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.err{color:var(--fail);font-size:13px;flex:1}
.chk{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}
.chk label{display:flex;gap:5px;align-items:center}.chk input{width:auto}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:14px;display:none;z-index:20}
.empty{text-align:center;padding:40px 16px;color:var(--mute)}
.foot{text-align:center;font-size:13px;padding:8px 16px 28px;max-width:1280px;margin:0 auto}
.foot .muted{margin-top:2px}
#rep .foot{border-top:1px solid #ccc;margin-top:24px;padding:8px 0 0;color:#555}
.menu{display:none}
.closemenu{display:none}
.notes{font-size:13px;margin:0 0 12px;padding:8px 10px;border:1px solid var(--line);border-left:4px solid var(--ev);border-radius:8px;display:grid;gap:3px}
.notes .nc{display:inline-block;min-width:26px;text-align:center;font-weight:700;color:var(--ev)}
#rep .notes{border-color:#ccc;border-left-color:#7a4fd1}
.vctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vctl input[type=date]{min-width:0}
.ic{display:none}
table.rt .cfl{display:none}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:2px 0 14px}
.sc{border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;padding:8px 10px;min-width:0}
.sc.warn{border-left-color:var(--warn)}.sc.fail{border-left-color:var(--fail)}
.sc .sn{font-size:13px;color:var(--mute);font-weight:600}.sc .sv{font-size:22px;font-weight:700;line-height:1.25}.sc .sv small{font-size:13px;font-weight:400;color:var(--mute)}.sc .ss{font-size:12.5px;color:var(--mute);margin-top:1px}
.app>*{min-width:0}
.cw{overflow-x:auto}
@media(max-width:820px){
 .app{grid-template-columns:minmax(0,1fr)}
 header{flex-wrap:wrap}
 header h1{flex:1 1 120px;min-width:0}
 header button{padding:6px 10px;font-size:14px}
 .head{gap:6px}
 .menu{display:inline-block}
 .side{display:none}
 body.menu .side{display:block;position:fixed;left:0;right:0;top:var(--hh,56px);bottom:0;z-index:12;margin:0;border-radius:0;border-width:1px 0 0;overflow:auto;-webkit-overflow-scrolling:touch;box-shadow:0 10px 30px rgba(0,0,0,.3)}
 body.menu{overflow:hidden}
 .closemenu{display:block!important;width:100%;margin-bottom:12px}
 input,select,textarea{font-size:16px}
  header{padding:10px 12px;gap:8px}
 header h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 button{padding:8px 12px}
 .card{padding:12px}
 .lb{display:none}.ic{display:inline}
 .sum{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
 .sc{padding:6px 8px}.sc .sv{font-size:19px}.sc .ss{font-size:12px}
 .head h2{font-size:18px}
 .head button{padding:5px 9px;font-size:13px}
 .legend.sec{display:none}
 .lvrow>*{flex:1 1 calc(50% - 10px)}
 .metarow>*{flex:1 1 calc(50% - 10px)!important;min-width:0}
 .metarow>label:first-child,.metarow>label:nth-last-child(2),.metarow>button{flex-basis:100%!important}
 .metarow>button{padding:11px}
 input[type=datetime-local]{min-height:42px;text-align:left}
 table.m,table.m tbody{display:block}
 table.m tr.hd{display:none}
 table.m tr{display:grid;gap:2px 10px;padding:10px 2px;border-bottom:1px solid var(--line)}
 table.m td,table.m td:empty{border:0;padding:0}
 table.m td:empty{display:none}
 table.rt tr.rr{grid-template-columns:1fr auto;grid-template-areas:"time st" "lv val" "fl fl" "note note" "op act"}
 table.rt tr.rr.fail{border-left:3px solid var(--fail);padding-left:8px}
 table.rt tr.rr.warn{border-left:3px solid var(--warn);padding-left:8px}
 table.rt .ctime{grid-area:time;font-weight:600}
 table.rt .cst{grid-area:st;text-align:right}
 table.rt .cst .fl{display:none}
 table.rt .clv{grid-area:lv}
 table.rt .cval{grid-area:val;text-align:right;font-size:17px;font-weight:600}
 table.rt .cfl{display:block;grid-area:fl;color:var(--mute);font-size:13px}
 table.rt .cnote{grid-area:note;font-size:13px}
 table.rt .cop{grid-area:op;color:var(--mute);font-size:13px;align-self:center}
 table.rt .cact{grid-area:act;text-align:right}
 table.rt tr.evrow{grid-template-columns:1fr auto;grid-template-areas:"time act" "txt txt"}
 table.rt tr.evrow td{background:transparent}
 table.rt .ctxt{grid-area:txt}
 table.stt tr{grid-template-columns:repeat(4,1fr)}
 table.stt .cname{grid-column:1/-1;font-weight:600;font-size:15px}
 table.stt td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--mute);font-weight:400}
 table.stt td[colspan]{grid-column:2/-1}
}
#rep{position:fixed;inset:0;z-index:30;background:#fff;color:#111;overflow:auto;display:none;--ink:#111;--mute:#555;--line:#d9dde4;--accent:#1f66d6;--ok:#1a7f5a;--warn:#b86e00;--fail:#c62f3d;--band:#eaf3ff;--band2:#fff6e2;--grid:#7b8494;--soft:#f0f2f6;--ev:#7a4fd1;--card:#fff;--bg:#fff}
#rep.on{display:block}
#rep .bar{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:8px 16px;display:flex;gap:8px;z-index:2}
#rep .page{max-width:960px;margin:0 auto;padding:16px}
#rep h1{font-size:21px;margin:0 0 4px}#rep h2{font-size:16px;margin:20px 0 6px;border-bottom:2px solid #333;padding-bottom:2px}
#rep h3{font-size:13px;margin:10px 0 2px}
#rep .cw,#rep tr{break-inside:avoid}
#rep table{font-size:12.5px}
#rep .sign{display:flex;gap:40px;margin-top:48px}#rep .sign div{flex:1;text-align:center;border-top:1px solid #333;padding-top:4px;font-size:13px}
@media print{body>*:not(#rep){display:none!important}#rep{position:static;overflow:visible}#rep .bar{display:none}svg.chart{min-width:0}}
</style>
</head>
<body>
<header>
  <button id="menuBtn" class="menu" data-act="menu" title="Danh sách thiết bị">☰</button>
  <h1>🧪 Nội kiểm xét nghiệm (IQC)</h1>
  <button data-act="report" title="Báo cáo" aria-label="Báo cáo"><span class="lb">Báo cáo</span><span class="ic">📄</span></button>
  <button data-act="data" title="Dữ liệu / GitHub" aria-label="Dữ liệu / GitHub"><span class="lb">Dữ liệu / GitHub</span><span class="ic">⚙️</span></button>
</header>
<div class="app">
  <aside class="side card" id="side"></aside>
  <main id="main"></main>
</div>
<footer class="foot"><div>Nội kiểm xét nghiệm (IQC) · Tác giả: <b>Bá Tử Kinh | Tường Vi</b></div><div class="muted">© 2026 Bá Tử Kinh | Tường Vi. Bảo lưu mọi quyền. Công cụ hỗ trợ cá nhân, không thay thế SOP của phòng xét nghiệm và xác nhận chính thức của cơ quan quản lý.</div></footer>
<dialog id="m"><div class="mh" id="mh"></div><div class="mb" id="mb"></div><div class="mf"><span class="err" id="me"></span><button id="mc">Đóng</button><button class="pri" id="ms">Lưu</button></div></dialog>
<div id="toast"></div>
<div id="rep"></div>
<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const x=parseFloat(String(v).trim().replace(',','.'));return isNaN(x)?NaN:x};
const fmt=(x,d=2)=>(x==null||isNaN(x))?'–':Number(x).toFixed(d);
const pad=n=>String(n).padStart(2,'0');
const fmtDT=ts=>{const d=new Date(ts);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtD=ts=>{const d=new Date(ts);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
const nowLocal=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const typeName={quant:'Định lượng',qual:'Định tính',semi:'Định tính có thang đo'};
const defaultRules={r12:true,r13:true,r22:true,r4s:true,r41:true,r10x:true};
const ruleNames={r12:'1-2s (cảnh báo)',r13:'1-3s',r22:'2-2s',r4s:'R-4s',r41:'4-1s',r10x:'10x'};
const MOB=()=>!!(window.matchMedia&&matchMedia('(max-width:820px)').matches);
const PALETTE=['#2f6fed','#d9731a','#1f9d6b','#8a4fd1','#0e9aa7','#c2417c'];
const LS='iqc.v1',GH='iqc.gh';
const EVT={maint:{n:'Bảo trì / bảo dưỡng',c:'BT',reset:false},calib:{n:'Hiệu chuẩn',c:'HC',reset:true},service:{n:'Sửa chữa / thay linh kiện',c:'SC',reset:true},reagent:{n:'Đổi lô thuốc thử',c:'TT',reset:true},qclot:{n:'Đổi lô vật liệu QC',c:'LQ',reset:true},param:{n:'Thay đổi thông số',c:'TS',reset:false},other:{n:'Sự kiện khác',c:'•',reset:false}};
const REASONS=['Thường quy','Chạy lại sau khắc phục','Sau bảo trì','Sau hiệu chuẩn','Sau sửa chữa / thay linh kiện','Đổi lô thuốc thử','Đổi lô vật liệu QC'];
const evFor=t=>S.events.filter(e=>e.deviceId===t.deviceId&&(!e.testId||e.testId===t.id)).sort((a,b)=>a.ts-b.ts);
const ADV={
'1-2s':{n:'Cảnh báo 1-2s: một giá trị vượt ±2SD',
 cause:['Dao động ngẫu nhiên bình thường: khoảng 5% giá trị QC nằm ngoài ±2SD dù hệ thống đang ổn định','Có thể là dấu hiệu sớm của sai số hệ thống hoặc sai số ngẫu nhiên'],
 act:['Chưa cần loại bỏ kết quả; xem các quy tắc khác và xu hướng các lần chạy gần nhất','Nếu chỉ vi phạm 1-2s: có thể tiếp tục trả kết quả và theo dõi sát lần QC kế tiếp','Kiểm tra nhanh hạn dùng thuốc thử, vật liệu QC và việc trộn đều QC']},
'1-3s':{n:'1-3s: một giá trị vượt ±3SD (thường là sai số ngẫu nhiên hoặc sai số hệ thống lớn)',
 cause:['Bọt khí, tắc hoặc nhiễm bẩn kim hút/ống dẫn; hút sai thể tích mẫu hoặc thuốc thử','Vật liệu QC: nhầm mức hoặc nhầm lọ, hoàn nguyên sai, chưa trộn đều, bay hơi, hết hạn hoặc bảo quản sai nhiệt độ','Thuốc thử hỏng, hết hạn, cạn hoặc nạp sai vị trí','Nhiệt độ buồng ủ hoặc điện áp không ổn định','Nhập sai số liệu (gõ nhầm giá trị hoặc đơn vị)'],
 act:['Kiểm tra lại số liệu đã nhập, đúng mức QC và đúng xét nghiệm','Chạy lại QC bằng cùng lọ; nếu vẫn lỗi, dùng lọ QC mới','Kiểm tra thuốc thử và các cảnh báo lỗi trên máy; bảo trì kim hút/ống dẫn theo SOP','Nếu nghi lệch hiệu chuẩn: hiệu chuẩn lại, rồi chạy lại QC tất cả các mức']},
'2-2s':{n:'2-2s: hai giá trị liên tiếp cùng vượt +2SD hoặc cùng vượt -2SD (sai số hệ thống)',
 cause:['Hiệu chuẩn bị lệch hoặc chất hiệu chuẩn xuống cấp','Thuốc thử xuống cấp, hoặc đổi lô thuốc thử mà chưa hiệu chuẩn lại','Vật liệu QC biến chất, bay hơi hoặc bảo quản sai','Nguồn sáng lão hóa, điện cực (ISE) xuống cấp, nhiệt độ buồng ủ thay đổi','Thay đổi chất lượng nước hoặc dung dịch rửa'],
 act:['Tạm dừng trả kết quả bệnh nhân của xét nghiệm này cho đến khi QC đạt','Kiểm tra thuốc thử, lọ QC và tình trạng hiệu chuẩn','Hiệu chuẩn lại (hoặc thay thuốc thử/chất hiệu chuẩn mới), rồi chạy lại QC tất cả các mức','Xem lại kết quả bệnh nhân đã trả từ lần QC đạt gần nhất']},
'R-4s':{n:'R-4s: hai mức QC trong cùng lần chạy lệch ngược chiều, vượt +2SD và -2SD (sai số ngẫu nhiên)',
 cause:['Kim hút hoặc pipet hoạt động không ổn định, bọt khí, tắc từng phần','Trộn QC hoặc thuốc thử không đều; thao tác pha QC không nhất quán','Dao động điện áp hoặc nhiệt độ, nhiễm bẩn chéo giữa các mẫu'],
 act:['Tạm dừng trả kết quả, kiểm tra kim hút/ống dẫn, bọt khí, thể tích hút','Chạy lại cả hai mức QC bằng lọ mới, trộn kỹ','Bảo trì/vệ sinh hệ thống hút theo SOP nếu lặp lại','Xem lại kết quả bệnh nhân đã trả từ lần QC đạt gần nhất']},
'4-1s':{n:'4-1s: bốn giá trị liên tiếp cùng một phía và vượt 1SD (sai số hệ thống nhỏ, đang trôi)',
 cause:['Thuốc thử hoặc chất hiệu chuẩn xuống cấp dần','Vật liệu QC biến chất dần (mở lọ lâu, bảo quản chưa đúng)','Nguồn sáng, điện cực hoặc bộ phận quang học xuống cấp','Nhiệt độ buồng ủ lệch nhẹ; thay đổi chất lượng nước'],

let S={version:1,devices:[],tests:[],results:[],events:[]};
let UI={deviceId:null,testId:null,lastN:40,sel:'n40',from:'',to:'',flash:null,showAll:false};
const T=id=>S.tests.find(t=>t.id===id), D=id=>S.devices.find(d=>d.id===id);

/* ---------- lưu trữ ---------- */
function loadLocal(){try{const j=localStorage.getItem(LS);if(j){S=JSON.parse(j);S.events??=[];return true}}catch(e){}return false}

  const c=ghCfg();if(c.auto&&c.token&&c.repo){clearTimeout(pushTimer);pushTimer=setTimeout(()=>ghPush(c).then(()=>toast('Đã đẩy lên GitHub')).catch(e=>toast('Lỗi GitHub: '+e.message)),4000)}}

function normalize(d){if(!d||!Array.isArray(d.devices)||!Array.isArray(d.tests)||!Array.isArray(d.results))throw new Error('File không đúng định dạng');d.events??=[];return d}

/* ---------- đánh giá quy tắc ---------- */
function evalTest(t){
  const res=S.results.filter(r=>r.testId===t.id).sort((a,b)=>a.ts-b.ts);
  const out={};
  if(t.type==='quant')evalQuant(t,res,out);else evalStep(t,res,out);
  return{res,out};
}
function evalQuant(t,res,out){
  const R={...defaultRules,...(t.rules||{})};
  const groups={},rs=evFor(t).filter(e=>e.reset),ep=r=>rs.filter(e=>e.ts<=r.ts).length;
  res.forEach(r=>{(groups[[r.levelId,r.lot||'',r.mean,r.sd,ep(r)].join('|')]??=[]).push(r)});
  const addF=(r,f,sev)=>{const o=out[r.id];if(!o.flags.includes(f))o.flags.push(f);if(sev==='fail')o.status='fail';else if(o.status!=='fail')o.status='warn'};
  Object.values(groups).forEach(list=>{
    list.forEach((r,i)=>{
      const z=(r.value-r.mean)/r.sd;
      out[r.id]={z,flags:[],status:'ok'};
      if(Math.abs(z)>3&&R.r13)addF(r,'1-3s','fail');
      else if(Math.abs(z)>2&&R.r12)addF(r,'1-2s','warn');
      if(R.r22&&i>=1){const zp=out[list[i-1].id].z;if(Math.abs(z)>2&&Math.abs(zp)>2&&Math.sign(z)===Math.sign(zp))addF(r,'2-2s','fail')}
      if(R.r41&&i>=3){const zs=[0,1,2,3].map(k=>out[list[i-k].id].z);if(zs.every(v=>v>1)||zs.every(v=>v<-1))addF(r,'4-1s','fail')}
      if(R.r10x&&i>=9){const zs=[...Array(10).keys()].map(k=>out[list[i-k].id].z);if(zs.every(v=>v>0)||zs.every(v=>v<0))addF(r,'10x','fail')}
      const tea=t.tea;
      if(tea&&tea.value>0&&r.mean!==0){
        const err=tea.kind==='pct'?(r.value-r.mean)/r.mean*100:r.value-r.mean;
        out[r.id].err=err;
        if(Math.abs(err)>tea.value)addF(r,'Vượt TEa','fail');
      }
    });
  });
  const byRun={};
  res.forEach(r=>{(byRun[r.run]??={})[r.levelId]=r});
  Object.values(byRun).forEach(m=>{
    const zs=Object.values(m).map(r=>({r,z:out[r.id].z}));
    if(zs.length<2)return;
    const hi=zs.reduce((a,b)=>b.z>a.z?b:a),lo=zs.reduce((a,b)=>b.z<a.z?b:a);
    if(R.r4s&&hi.z>2&&lo.z<-2){addF(hi.r,'R-4s','fail');addF(lo.r,'R-4s','fail')}
    if(R.r22)[zs.filter(x=>x.z>2),zs.filter(x=>x.z<-2)].forEach(g=>{if(g.length>=2)g.forEach(x=>addF(x.r,'2-2s (liên mức)','fail'))});
  });
}
function evalStep(t,res,out){
  const idx=v=>t.scale.indexOf(v);
  const groups={},rs=evFor(t).filter(e=>e.reset),ep=r=>rs.filter(e=>e.ts<=r.ts).length;
  res.forEach(r=>{(groups[[r.levelId,r.lot||'',r.expected,r.tol,ep(r)].join('|')]??=[]).push(r)});
  Object.values(groups).forEach(list=>{
    list.forEach((r,i)=>{
      const dev=idx(r.value)-idx(r.expected),tol=r.tol||0;
      const o=out[r.id]={dev,flags:[],status:'ok'};
      if(Math.abs(dev)>tol){o.status='fail';o.flags.push(t.type==='qual'?'Sai kết quả':`Lệch ${dev>0?'+':''}${dev} bậc`)}
      else if(tol>0&&Math.abs(dev)===tol){o.status='warn';o.flags.push('Sát giới hạn')}
      if(i>=3){const ds=[0,1,2,3].map(k=>out[list[i-k].id].dev);
        if(ds.every(v=>v>0)||ds.every(v=>v<0)){if(o.status==='ok')o.status='warn';o.flags.push('4 lần lệch cùng phía')}}
    });
  });
}
const isCur=(t,l,r)=>r.levelId===l.id&&(r.lot||'')===(l.lot||'')&&(t.type==='quant'?(r.mean===l.mean&&r.sd===l.sd):(r.expected===l.expected&&(r.tol||0)===(l.tol||0)));
function testStatus(t){
  const {res,out}=evalTest(t);if(!res.length)return'none';
  let st='ok';
  t.levels.forEach(l=>{const last=[...res].reverse().find(r=>r.levelId===l.id);if(last&&out[last.id]){const s=out[last.id].status;if(s==='fail')st='fail';else if(s==='warn'&&st!=='fail')st='warn'}});
  return st;
}

/* ---------- biểu đồ SVG ---------- */
function marker(x,y,st,title,color){
  const sty=color&&st==='ok'?` style="fill:${color}"`:'';
  let s;
  if(st==='fail')s=`<rect x="${x-5}" y="${y-5}" width="10" height="10" class="fp"/>`;
  else if(st==='warn')s=`<path d="M${x} ${y-6}L${x+6} ${y+5}L${x-6} ${y+5}Z" class="wp"/>`;
  else s=`<circle cx="${x}" cy="${y}" r="4" class="okp"${sty}/>`;
  return `<g>${s}<title>${esc(title)}</title></g>`;
}
function xTicks(items,X,y){
  const n=items.length;if(!n)return'';
  const step=Math.max(1,Math.ceil(n/(MOB()?5:9)));let s='';
  items.forEach((p,i)=>{if(i%step===0||i===n-1)s+=`<text x="${X(i)}" y="${y}" class="tk" text-anchor="${i===n-1&&n>1?'end':'middle'}">${fmtD(p.r.ts)}</text>`});
  return s;
}
function legend(extra='',sec=false){return `<div class="legend${sec?' sec':''}"><span><i style="background:var(--accent)"></i>Đạt</span><span>▲ Cảnh báo</span><span>■ Vi phạm / ngoài giới hạn</span>${extra}${S.events.length?'<span style="color:var(--ev)">┆ Sự kiện thiết bị (BT bảo trì · HC hiệu chuẩn · SC sửa chữa · TT thuốc thử · LQ lô QC · TS đổi thông số)</span>':''}</div>`}
const VIEW_OPTS=[['n20','20 điểm gần nhất'],['n40','40 điểm gần nhất'],['n90','90 điểm gần nhất'],['n0','Tất cả'],['today','Hôm nay'],['7','7 ngày gần nhất'],['30','30 ngày gần nhất'],['month','Tháng này'],['prev','Tháng trước'],['day','Một ngày…'],['custom','Khoảng ngày…']];
const dayStart=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]).getTime():NaN};
const addDays=(s,n)=>{const t=dayStart(s);return isNaN(t)?s:ymd(new Date(new Date(t).getFullYear(),new Date(t).getMonth(),new Date(t).getDate()+n).getTime())};
function viewRange(){
  const s=UI.sel||'n40',n=new Date(),sod=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime(),D=864e5;
  if(s[0]==='n')return null;
  if(s==='today')return{from:sod,to:sod+D-1,label:'Hôm nay'};
  if(s==='7'||s==='30')return{from:new Date(n.getFullYear(),n.getMonth(),n.getDate()-(+s-1)).getTime(),to:Infinity,label:s+' ngày gần nhất'};
  if(s==='month')return{from:new Date(n.getFullYear(),n.getMonth(),1).getTime(),to:new Date(n.getFullYear(),n.getMonth()+1,1).getTime()-1,label:'Tháng này'};
  if(s==='prev')return{from:new Date(n.getFullYear(),n.getMonth()-1,1).getTime(),to:new Date(n.getFullYear(),n.getMonth(),1).getTime()-1,label:'Tháng trước'};
  const f=dayStart(UI.from),t=dayStart(UI.to);
  if(s==='day'){const a=isNaN(f)?sod:f;return{from:a,to:new Date(new Date(a).getFullYear(),new Date(a).getMonth(),new Date(a).getDate()+1).getTime()-1,label:'Ngày '+fmtDMY(a)}}
  const a=isNaN(f)?0:f,b=isNaN(t)?Infinity:new Date(new Date(t).getFullYear(),new Date(t).getMonth(),new Date(t).getDate()+1).getTime()-1;
  return{from:a,to:b,label:(isNaN(f)?'…':fmtDMY(a))+' – '+(isNaN(t)?'…':fmtDMY(t))};
}
const fmtDMY=ts=>{const d=new Date(ts);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`};
function lastN(arr){const v=viewRange();if(v)return arr.filter(p=>p.r.ts>=v.from&&p.r.ts<=v.to);return UI.lastN>0?arr.slice(-UI.lastN):arr}
function viewControls(){
  const s=UI.sel,opts=VIEW_OPTS.map(([v,l])=>`<option value="${v}" ${v===s?'selected':''}>${l}</option>`).join('');
  let h=`<div class="vctl"><label class="fld" style="flex-direction:row;align-items:center;gap:6px">Xem <select id="viewSel" style="width:auto">${opts}</select></label>`;

  if(s==='custom')h+=`<label class="fld" style="flex-direction:row;align-items:center;gap:6px">Từ <input type="date" id="vFrom" value="${esc(UI.from)}" style="width:auto"></label><label class="fld" style="flex-direction:row;align-items:center;gap:6px">đến <input type="date" id="vTo" value="${esc(UI.to)}" style="width:auto"></label>`;
  return h+'</div>';
}
const emptyMsg=()=>viewRange()?`<div class="muted">Không có kết quả trong khoảng thời gian đã chọn.</div>`:`<div class="muted">Chưa có kết quả.</div>`;

function evLines(t,ts,X,y1,y2,xmax){
  const n=ts.length;if(!n)return'';let s='';
  const vr=viewRange();
  evFor(t).forEach(e=>{
    if(vr&&(e.ts<vr.from||e.ts>vr.to))return;
    const i=ts.findIndex(v=>v>=e.ts);
    if(i===0)return;
    let x;
    if(i<0){x=X(n-1)+(n>1?(X(1)-X(0))/2:14);if(x>xmax)x=xmax}else x=(X(i-1)+X(i))/2;
    const tip=`${EVT[e.type].n} · ${fmtDT(e.ts)}${e.note?' · '+e.note:''}`;
    s+=`<g><line x1="${x}" x2="${x}" y1="${y1}" y2="${y2}" class="evl"/><text x="${x}" y="${y1-2}" class="evt" text-anchor="middle">${EVT[e.type].c}</text><title>${esc(tip)}</title></g>`;
  });
  return s;
}
function describeParams(t,a,b){
  const p=[],f=v=>v==null||v===''?'–':v;
  if(t.type==='quant'){if(a.mean!==b.mean)p.push(`Mean ${a.mean} → ${b.mean}`);if(a.sd!==b.sd)p.push(`SD ${a.sd} → ${b.sd}`)}
  else{if(a.expected!==b.expected)p.push(`mong đợi ${a.expected} → ${b.expected}`);if((a.tol||0)!==(b.tol||0))p.push(`sai lệch ${a.tol||0} → ${b.tol||0} bậc`)}
  if((a.lot||'')!==(b.lot||''))p.push(`lô ${f(a.lot)} → ${f(b.lot)}`);
  return p.join(', ');
}
function segInfo(t,pts){
  const segs=[],evs=evFor(t).filter(e=>e.type==='param');
  pts.forEach((p,i)=>{
    const r=p.r,k=t.type==='quant'?[r.mean,r.sd,r.lot||''].join('|'):[r.expected,r.tol||0,r.lot||''].join('|'),s=segs[segs.length-1];
    if(s&&s.k===k)s.i1=i;else segs.push({k,i0:i,i1:i,r});
  });
  segs.forEach((s,si)=>{
    if(!si)return;
    const a=pts[segs[si-1].i1].r,b=pts[s.i0].r;
    s.cov=evs.some(e=>e.ts>a.ts&&e.ts<=b.ts);
    s.text=describeParams(t,a,b);
  });
  return segs;
}
function pendingChange(t,level,pts,segs){
  if(!pts.length||level.mean===undefined&&level.expected===undefined)return'';
  const last=pts[pts.length-1].r;
  if(evFor(t).some(e=>e.type==='param'&&e.ts>last.ts))return'';
  return describeParams(t,last,level);
}
const tsMark=(x,y1,y2,tip)=>`<g><line x1="${x}" x2="${x}" y1="${y1}" y2="${y2}" class="evl"/><text x="${x}" y="${y1-2}" class="evt" text-anchor="middle">TS</text><title>${esc(tip)}</title></g>`;
function ljChart(level,pts,t){
  const M=MOB(),d=t.dec??2,n=pts.length,W=M?420:840,H=M?270:300,L=M?48:64,R=M?38:48,Tp=14,B=M?32:36;
  const segs=segInfo(t,pts);
  let lo=Infinity,hi=-Infinity;
  segs.forEach(s=>{lo=Math.min(lo,s.r.mean-3.6*s.r.sd);hi=Math.max(hi,s.r.mean+3.6*s.r.sd)});
  pts.forEach(p=>{lo=Math.min(lo,p.r.value-.2*p.r.sd);hi=Math.max(hi,p.r.value+.2*p.r.sd)});
  const X=i=>n<=1?L+(W-L-R)/2:L+(W-L-R)*i/(n-1),Y=v=>Tp+(H-Tp-B)*(hi-v)/(hi-lo);
  const bx=si=>si<=0?L:(X(segs[si-1].i1)+X(segs[si].i0))/2;
  const KS=[[3,'l3'],[2,'l2'],[1,'l1'],[0,'l0'],[-1,'l1'],[-2,'l2'],[-3,'l3']];
  let g='';
  segs.forEach((s,si)=>{
    const x0=bx(si),x1=si===segs.length-1?W-R:bx(si+1),m=s.r.mean,sd=s.r.sd;
    g+=`<rect x="${x0}" y="${Y(m+2*sd)}" width="${x1-x0}" height="${Y(m-2*sd)-Y(m+2*sd)}" class="band"/>`;
    KS.forEach(([k,c])=>{g+=`<line x1="${x0}" x2="${x1}" y1="${Y(m+k*sd)}" y2="${Y(m+k*sd)}" class="${c}"/>`});
  });
  const cur=segs[segs.length-1].r;
  KS.forEach(([k])=>{const y=Y(cur.mean+k*cur.sd);
    g+=`<text x="${L-6}" y="${y+4}" class="tk" text-anchor="end">${fmt(cur.mean+k*cur.sd,d)}</text><text x="${W-R+6}" y="${y+4}" class="tk">${k===0?'TB':(k>0?'+':'')+k+'SD'}</text>`});
  if(n>1)g+=`<path class="ln" d="${pts.map((p,i)=>(i?'L':'M')+X(i)+' '+Y(p.r.value)).join('')}"/>`;
  g+=evLines(t,pts.map(p=>p.r.ts),X,Tp,H-B,W-R-4);
  segs.forEach((s,si)=>{if(si&&!s.cov)g+=tsMark(bx(si),Tp,H-B,`${fmtDT(pts[s.i0].r.ts)} · Đổi thông số: ${s.text}`)});
  const pc=pendingChange(t,level,pts,segs);
  if(pc)g+=tsMark(W-R-4,Tp,H-B,`Thông số hiện tại đã đổi (${pc}), áp dụng từ kết quả tiếp theo`);
  pts.forEach((p,i)=>{const z=p.o.z;g+=marker(X(i),Y(p.r.value),p.o.status,`${fmtDT(p.r.ts)} | ${fmt(p.r.value,d)} ${t.unit||''} | z=${fmt(z,2)}${p.o.flags.length?' | '+p.o.flags.join(', '):''}`)});
  g+=xTicks(pts,X,H-12);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ Levey-Jennings ${esc(level.name)}">${g}</svg>`;
}
function zChart(t,levelSeries){
  const M=MOB(),W=M?420:840,H=M?270:300,L=M?40:64,R=M?38:48,Tp=14,B=M?32:36;
  const runs=[...new Set(levelSeries.flatMap(ls=>ls.pts.map(p=>p.r.run)))].sort().slice(!viewRange()&&UI.lastN>0?-UI.lastN:0);
  const n=runs.length;if(!n)return'';
  let lim=4;levelSeries.forEach(ls=>ls.pts.forEach(p=>{if(runs.includes(p.r.run))lim=Math.max(lim,Math.ceil(Math.abs(p.o.z)+.3))}));
  const X=i=>n<=1?L+(W-L-R)/2:L+(W-L-R)*i/(n-1),Y=v=>Tp+(H-Tp-B)*(lim-v)/(2*lim);
  let g=`<rect x="${L}" y="${Y(2)}" width="${W-L-R}" height="${Y(-2)-Y(2)}" class="band"/>`;
  [[3,'l3'],[2,'l2'],[1,'l1'],[0,'l0'],[-1,'l1'],[-2,'l2'],[-3,'l3']].forEach(([k,c])=>{const y=Y(k);
    g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="${c}"/><text x="${L-6}" y="${y+4}" class="tk" text-anchor="end">${k>0?'+':''}${k}</text>`});
  g+=`<text x="${W-R+6}" y="${Y(0)+4}" class="tk">z (SD)</text>`;
  g+=evLines(t,runs.map(r=>new Date(r+'T12:00').getTime()),X,Tp,H-B,W-R-4);
  levelSeries.forEach((ls,li)=>{
    const col=PALETTE[li%PALETTE.length];
    const pp=ls.pts.filter(p=>runs.includes(p.r.run)).map(p=>({x:X(runs.indexOf(p.r.run)),y:Y(p.o.z),p}));
    if(pp.length>1)g+=`<path fill="none" stroke="${col}" stroke-width="1.5" opacity=".8" d="${pp.map((q,i)=>(i?'L':'M')+q.x+' '+q.y).join('')}"/>`;
    pp.forEach(q=>{g+=marker(q.x,q.y,q.p.o.status,`${ls.level.name} | ${fmtDT(q.p.r.ts)} | z=${fmt(q.p.o.z,2)}${q.p.o.flags.length?' | '+q.p.o.flags.join(', '):''}`,col)});
  });
  const dates=runs.map(r=>({r:{ts:new Date(r+'T12:00').getTime()}}));
  g+=xTicks(dates,X,H-12);
  const lg=levelSeries.map((ls,i)=>`<span><i style="background:${PALETTE[i%PALETTE.length]}"></i>${esc(ls.level.name)}</span>`).join('');
  return legend(lg)+`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ z-score nhiều mức">${g}</svg>`;
}
function stepChart(level,pts,t){
  const M=MOB(),sc=t.scale,rows=sc.length,rowH=M?30:34,W=M?420:840,L=M?74:90,R=M?12:20,Tp=12,B=M?30:34,H=Tp+B+rows*rowH;
  const valid=pts.filter(p=>sc.indexOf(p.r.value)>=0),vn=valid.length;
  const X2=i=>vn<=1?L+(W-L-R)/2:L+(W-L-R)*i/(vn-1),Y=k=>Tp+(rows-1-k+.5)*rowH;
  const segs=vn?segInfo(t,valid):[];
  const bx=si=>si<=0?L:(X2(segs[si-1].i1)+X2(segs[si].i0))/2;
  let g='';
  segs.forEach((s,si)=>{
    const x0=bx(si),x1=si===segs.length-1?W-R:bx(si+1),e=sc.indexOf(s.r.expected),tol=s.r.tol||0;
    for(let k=0;k<rows;k++){const cls=k===e?'band':(Math.abs(k-e)<=tol?'band2':'');if(cls)g+=`<rect x="${x0}" y="${Y(k)-rowH/2}" width="${x1-x0}" height="${rowH}" class="${cls}"/>`}
  });
  for(let k=0;k<rows;k++)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(k)}" y2="${Y(k)}" class="l1"/><text x="${L-8}" y="${Y(k)+4}" class="tk" text-anchor="end" style="font-size:12px">${esc(sc[k])}</text>`;
  if(vn>1)g+=`<path class="ln" d="${valid.map((p,i)=>(i?'L':'M')+X2(i)+' '+Y(sc.indexOf(p.r.value))).join('')}"/>`;
  g+=evLines(t,valid.map(p=>p.r.ts),X2,Tp,H-B,W-R-4);
  segs.forEach((s,si)=>{if(si&&!s.cov)g+=tsMark(bx(si),Tp,H-B,`${fmtDT(valid[s.i0].r.ts)} · Đổi thông số: ${s.text}`)});
  const pc=pendingChange(t,level,valid,segs);
  if(pc)g+=tsMark(W-R-4,Tp,H-B,`Thông số hiện tại đã đổi (${pc}), áp dụng từ kết quả tiếp theo`);
  valid.forEach((p,i)=>{g+=marker(X2(i),Y(sc.indexOf(p.r.value)),p.o.status,`${fmtDT(p.r.ts)} | ${p.r.value} (mục tiêu: ${p.r.expected})${p.o.flags.length?' | '+p.o.flags.join(', '):''}`)});
  g+=xTicks(valid,X2,H-10);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ theo dõi ${esc(level.name)}">${g}</svg>`;
}

    h+=`<div class="dev"><h3><span>${esc(d.name)}</span><span><button class="sm" data-act="editDevice" data-id="${d.id}" title="Sửa thiết bị">✎</button> <button class="sm" data-act="newTest" data-id="${d.id}" title="Thêm xét nghiệm">＋</button></span></h3>`;
    const ts=S.tests.filter(t=>t.deviceId===d.id);
    if(!ts.length)h+=`<div class="muted" style="font-size:13px;padding:4px 8px">Chưa có xét nghiệm</div>`;
    ts.forEach(t=>{h+=`<div class="t ${t.id===UI.testId?'on':''}" data-act="pick" data-id="${t.id}"><span class="dot ${testStatus(t)}"></span><span style="flex:1">${esc(t.name)}</span><small class="muted">${t.type==='quant'?'ĐL':t.type==='semi'?'ĐT-thang':'ĐT'}</small></div>`});
    h+='</div>';
  });
  h+=`<button data-act="newDevice" style="width:100%">＋ Thêm thiết bị</button>`;
  $('#side').innerHTML=h;
}
function renderMain(){
  const t=T(UI.testId);
  if(!t){
    $('#main').innerHTML=`<div class="card empty"><h2>Bắt đầu</h2><p>${S.devices.length?'Chọn một xét nghiệm ở danh sách bên trái, hoặc bấm ＋ cạnh thiết bị để thêm xét nghiệm mới.':'Thêm thiết bị đầu tiên, sau đó khai báo các xét nghiệm và mức nội kiểm (mean, SD, TEa…).'}</p><p><button class="pri" data-act="${S.devices.length?'newTest':'newDevice'}">${S.devices.length?'＋ Thêm xét nghiệm':'＋ Thêm thiết bị'}</button></p></div>`;
    return;
  }
  const dev=D(t.deviceId),d=t.dec??2,{res,out}=evalTest(t);
  let h=`<div class="card"><div class="head"><h2>${esc(t.name)}</h2><span class="badge">${typeName[t.type]}</span><span class="muted">${esc(dev?.name||'')}${t.unit?' · '+esc(t.unit):''}${t.tea&&t.tea.value>0?` · TEa ${t.tea.value}${t.tea.kind==='pct'?'%':' '+esc(t.unit||'')}`:''}</span><span class="spacer"></span>
  <button data-act="newEvent" data-id="${t.id}">＋ Sự kiện</button><button data-act="editTest" data-id="${t.id}">Khai báo</button><button data-act="csv" data-id="${t.id}">CSV</button><button data-act="xlsx" data-id="${t.id}">Excel</button><button class="danger" data-act="delTest" data-id="${t.id}">Xóa</button></div>${sumHTML(t,res,out)}${entryHTML(t)}</div>`;
  if(UI.flash){h+=UI.flash;UI.flash=null}
  else if(res.length){
    const last=res[res.length-1].run;
    const bad=res.filter(r=>r.run===last&&out[r.id]&&out[r.id].flags.length);
    if(bad.length)h+=`<div class="alert ${bad.some(r=>out[r.id].status==='fail')?'fail':''}"><b>Lần chạy gần nhất (${last.split('-').reverse().join('/')}):</b> ${bad.map(r=>`${esc(r.levelName)}: ${esc(out[r.id].flags.join(', '))}`).join(' · ')}<br>${adviceBtn(bad.flatMap(r=>out[r.id].flags))}</div>`;
  }
  if(!t.levels.length)h+=`<div class="card muted">Chưa có mức QC nào — bấm “Khai báo” để thêm.</div>`;
  else{
    h+=`<div class="card"><div class="head"><h2>Biểu đồ theo dõi</h2><span class="spacer"></span>${viewControls()}</div>${viewRange()?`<div class="muted" style="margin:-4px 0 8px;font-size:13px">Đang xem: ${esc(viewRange().label)}</div>`:''}`;
    const series=t.levels.map(l=>({level:l,pts:lastN(res.filter(r=>r.levelId===l.id&&out[r.id]).map(r=>({r,o:out[r.id]})))}));
    h+=notesHTML(t,series);
    if(t.type==='quant'){
      if(series.length>=2){const zc=zChart(t,series);if(zc)h+=`<h3 style="font-size:14px;margin:6px 0">Tất cả các mức (z-score)</h3>`+zc}
      series.forEach(ls=>{
        h+=`<h3 style="font-size:14px;margin:14px 0 2px">${esc(ls.level.name)} <small class="muted">${ls.level.lot?'lô '+esc(ls.level.lot)+' · ':''}hiện tại: TB ${fmt(ls.level.mean,d)} · SD ${fmt(ls.level.sd,d)} · CV ${fmt(ls.level.sd/ls.level.mean*100,1)}%</small></h3>`;
        h+=ls.pts.length?legend('',true)+ljChart(ls.level,ls.pts,t):emptyMsg();
      });
    }else{
      series.forEach(ls=>{
        h+=`<h3 style="font-size:14px;margin:14px 0 2px">${esc(ls.level.name)} <small class="muted">${ls.level.lot?'lô '+esc(ls.level.lot)+' · ':''}mục tiêu: ${esc(ls.level.expected)}${t.type==='semi'?` (±${ls.level.tol||0} bậc)`:''}</small></h3>`;
        h+=ls.pts.length?legend()+stepChart(ls.level,ls.pts,t):emptyMsg();
      });
    }
    h+='</div>';
    h+=statsHTML(t,res,out);
  }
  h+=tableHTML(t,res,out);
  $('#main').innerHTML=wrapSvg(h);
}
function notesHTML(t,series){
  const vr=viewRange(),items=[];
  let minTs=Infinity;series.forEach(ls=>ls.pts.forEach(p=>{minTs=Math.min(minTs,p.r.ts)}));
  evFor(t).forEach(e=>{
    if(vr?(e.ts<vr.from||e.ts>vr.to):(e.ts<minTs))return;
    items.push({ts:e.ts,c:EVT[e.type].c,text:EVT[e.type].n+(e.note?': '+e.note:'')+(e.op?' ('+e.op+')':'')});
  });
  series.forEach(ls=>{
    segInfo(t,ls.pts).forEach((s,si)=>{if(si&&!s.cov)items.push({ts:ls.pts[s.i0].r.ts,c:'TS',text:`${ls.level.name}: đổi thông số (${s.text})`})});
    const pc=pendingChange(t,ls.level,ls.pts,null);
    if(pc)items.push({ts:Date.now(),c:'TS',text:`${ls.level.name}: thông số hiện tại đã đổi (${pc}), áp dụng từ kết quả tiếp theo`});
  });
  if(!items.length)return'';
  items.sort((a,b)=>a.ts-b.ts);
  return `<div class="notes"><b>Ghi chú trên biểu đồ</b>${items.map(i=>`<div><span class="nc">${esc(i.c)}</span> ${fmtDT(i.ts)} · ${esc(i.text)}</div>`).join('')}</div>`;
}
function levelGroups(rs,out){
  const m=new Map();
  rs.forEach(r=>{let g=m.get(r.levelId);if(!g){g={level:{id:r.levelId},pts:[]};m.set(r.levelId,g)}
    g.level={id:r.levelId,name:r.levelName,lot:r.lot||'',mean:r.mean,sd:r.sd,expected:r.expected,tol:r.tol};g.pts.push({r,o:out[r.id]})});
  return[...m.values()];
}
function diffTest(o,t){
  const ch=[],f=v=>v==null||v===''?'–':v,ts=x=>x&&x.value>0?x.value+(x.kind==='pct'?'%':' '+(t.unit||'')):'không';
  if(o.type==='quant'){
    if((o.unit||'')!==(t.unit||''))ch.push(`Đơn vị: ${f(o.unit)} → ${f(t.unit)}`);
    if(ts(o.tea)!==ts(t.tea))ch.push(`TEa: ${ts(o.tea)} → ${ts(t.tea)}`);
  }else if((o.scale||[]).join()!==(t.scale||[]).join())ch.push('Thang kết quả đã đổi');
  t.levels.forEach(l=>{
    const ol=o.levels.find(x=>x.id===l.id);
    if(!ol){ch.push(`Thêm mức ${l.name}`);return}
    const p=[];
    if(ol.name!==l.name)p.push(`tên ${ol.name} → ${l.name}`);
    if((ol.lot||'')!==(l.lot||''))p.push(`lô ${f(ol.lot)} → ${f(l.lot)}`);
    if(t.type==='quant'){if(ol.mean!==l.mean)p.push(`Mean ${ol.mean} → ${l.mean}`);if(ol.sd!==l.sd)p.push(`SD ${ol.sd} → ${l.sd}`)}
    else{if(ol.expected!==l.expected)p.push(`mong đợi ${ol.expected} → ${l.expected}`);if((ol.tol||0)!==(l.tol||0))p.push(`sai lệch ${ol.tol||0} → ${l.tol||0} bậc`)}
    if(p.length)ch.push(`${l.name}: ${p.join(', ')}`);
  });
  o.levels.forEach(ol=>{if(!t.levels.find(l=>l.id===ol.id))ch.push(`Xóa mức ${ol.name}`)});
  return ch;
}
function sumHTML(t,res,out){
  if(!t.levels.length)return'';
  const d=t.dec??2,q=t.type==='quant';
  const cards=t.levels.map(l=>{
    const pts=res.filter(r=>r.levelId===l.id&&out[r.id]),last=pts[pts.length-1];
    if(!last)return `<div class="sc"><div class="sn">${esc(l.name)}</div><div class="muted" style="font-size:13px">Chưa có kết quả</div></div>`;
    const o=out[last.id],cls=o.status==='ok'?'':o.status;
    const val=q?`${fmt(last.value,d)} <small>${esc(t.unit||'')}</small>`:esc(last.value);
    const sub=q?`z = ${fmt(o.z,2)}`:(t.type==='semi'?`lệch ${o.dev>0?'+':''}${o.dev} bậc · mục tiêu ${esc(l.expected)}`:`mục tiêu: ${esc(l.expected)}`);
    const stl={ok:'Đạt',warn:'Cảnh báo',fail:'Vi phạm'}[o.status];
    return `<div class="sc ${cls}"><div class="sn">${esc(l.name)}</div><div class="sv">${val}</div><div class="ss">${sub}</div><div class="ss"><span class="badge ${o.status}">${stl}</span> ${o.flags.length?esc(o.flags.join(', ')):''}</div><div class="ss">${fmtDT(last.ts)} · n=${pts.length}</div>${isCur(t,l,last)?'':'<div class="ss" style="color:var(--ev)">TS: thông số đã đổi, chưa có KQ mới</div>'}</div>`;
  }).join('');
  return `<div class="sum">${cards}</div>`;
}
function entryHTML(t){
  if(!t.levels.length)return'';
  const d=t.dec??2,dr=defaultReason(t);
  const f=t.levels.map(l=>`<label class="fld"><span>${esc(l.name)}${l.lot?` <small>(lô ${esc(l.lot)})</small>`:''}</span>${t.type==='quant'?`<input name="v_${l.id}" inputmode="decimal" autocomplete="off" placeholder="${esc(t.unit||'giá trị')}">`:`<select name="v_${l.id}"><option value="">— không chạy —</option>${t.scale.map(s=>`<option>${esc(s)}</option>`).join('')}</select>`}<small>Mục tiêu: ${t.type==='quant'?fmt(l.mean,d)+' ± '+fmt(l.sd,d):esc(l.expected)+(t.type==='semi'?' (±'+(l.tol||0)+' bậc)':'')}</small></label>`).join('');
  return `<form id="entryForm" data-test="${t.id}"><div class="row lvrow">${f}</div><div class="row metarow" style="margin-top:10px"><label class="fld"><span>Ngày giờ</span><input type="datetime-local" name="dt" value="${nowLocal()}" required></label><label class="fld"><span>Lý do chạy QC</span><select name="reason">${REASONS.map(x=>`<option ${x===dr?'selected':''}>${x}</option>`).join('')}</select></label><label class="fld"><span>Người thực hiện</span><input name="op" autocomplete="off"></label><label class="fld" style="flex:2 1 220px"><span>Ghi chú</span><input name="note" autocomplete="off"></label><button class="pri" type="submit" style="flex:0 0 auto">Lưu kết quả</button></div></form>`;
}
function statsHTML(t,res,out){
  if(t.type==='quant'){
    const d=t.dec??2;let rows='';
    t.levels.forEach(l=>{
      const v=res.filter(r=>isCur(t,l,r)).map(r=>r.value),n=v.length;
      if(!n){rows+=`<tr><td class="cname">${esc(l.name)}</td><td data-l="n">0</td><td colspan="6" class="muted">—</td></tr>`;return}
      const mean=v.reduce((a,b)=>a+b,0)/n,sd=n>1?Math.sqrt(v.reduce((a,b)=>a+(b-mean)**2,0)/(n-1)):NaN,cv=sd/mean*100,bias=(mean-l.mean)/l.mean*100;
      const sig=t.tea&&t.tea.kind==='pct'&&t.tea.value>0&&n>1?(t.tea.value-Math.abs(bias))/cv:NaN;
      rows+=`<tr><td class="cname">${esc(l.name)}</td><td data-l="n">${n}</td><td data-l="TB mục tiêu">${fmt(l.mean,d)}</td><td data-l="TB thực tế">${fmt(mean,d)}</td><td data-l="SD thực tế">${fmt(sd,d)}</td><td data-l="CV%">${fmt(cv,1)}%</td><td data-l="Bias%">${fmt(bias,1)}%</td><td data-l="Sigma">${fmt(sig,1)}</td></tr>`;
    });
    return `<div class="card"><h2>Thống kê (lô hiện tại)</h2><div class="scroll"><table class="m stt"><tr class="hd"><th>Mức</th><th>n</th><th>TB mục tiêu</th><th>TB thực tế</th><th>SD thực tế</th><th>CV%</th><th>Bias%</th><th>Sigma</th></tr>${rows}</table></div><small class="muted">Sigma = (TEa% − |Bias%|) / CV%, chỉ tính khi TEa khai báo theo %.</small></div>`;
  }
  let rows='';
  t.levels.forEach(l=>{
    const cur=res.filter(r=>isCur(t,l,r)&&out[r.id]),n=cur.length,ok=cur.filter(r=>out[r.id].status!=='fail').length;
    rows+=`<tr><td class="cname">${esc(l.name)}</td><td data-l="Mục tiêu">${esc(l.expected)}</td><td data-l="n">${n}</td><td data-l="Tỷ lệ đạt">${n?fmt(ok/n*100,1)+'%':'–'}</td><td data-l="Không đạt">${cur.filter(r=>out[r.id].status==='fail').length}</td></tr>`;
  });
  return `<div class="card"><h2>Thống kê (lô hiện tại)</h2><div class="scroll"><table class="m stt"><tr class="hd"><th>Mức</th><th>Mục tiêu</th><th>n</th><th>Tỷ lệ đạt</th><th>Không đạt</th></tr>${rows}</table></div></div>`;
}
function tableHTML(t,res,out){
  const d=t.dec??2;
  const vr=viewRange();
  let items=[...res.map(r=>({k:'r',ts:r.ts,r})),...evFor(t).map(e=>({k:'e',ts:e.ts,e}))].sort((a,b)=>b.ts-a.ts);
  if(vr)items=items.filter(it=>it.ts>=vr.from&&it.ts<=vr.to);
  const shown=UI.showAll?items:items.slice(0,40);
  const rows=shown.map(it=>{
    if(it.k==='e'){const e=it.e,ev=EVT[e.type];
      return `<tr class="evrow"><td class="ctime">${fmtDT(e.ts)}</td><td colspan="5" class="ctxt"><b>${ev.c}</b> <b>${esc(ev.n)}</b>${e.testId?'':' <small class="muted">(toàn thiết bị)</small>'}${e.note?' — '+esc(e.note):''}${e.op?` <small class="muted">· ${esc(e.op)}</small>`:''}${e.reset?' <small class="muted">· bắt đầu chuỗi quy tắc mới</small>':''}</td><td class="cact"><button class="sm danger" data-act="delEvt" data-id="${e.id}" title="Xóa sự kiện">✕</button></td></tr>`}
    const r=it.r,o=out[r.id]||{flags:[],status:'ok'};
    const dv=t.type==='quant'?`${fmt(r.value,d)} <small class="muted">z ${fmt(o.z,2)}</small>`:`${esc(r.value)} <small class="muted">${t.type==='semi'?'lệch '+(o.dev>0?'+':'')+o.dev:''}</small>`;
    const stl={ok:'Đạt',warn:'Cảnh báo',fail:'Vi phạm'}[o.status];
    const rb=r.reason&&r.reason!=='Thường quy'?`<br><span class="badge">${esc(r.reason)}</span>`:'';
    const fl=o.flags.join(', ');
    return `<tr class="rr ${o.status}"><td class="ctime">${fmtDT(r.ts)}${rb}</td><td class="clv">${esc(r.levelName)}${r.lot?`<br><small class="muted">lô ${esc(r.lot)}</small>`:''}</td><td class="cval">${dv}</td><td class="cst"><span class="badge ${o.status}">${stl}</span><span class="fl"> ${esc(fl)}</span></td><td class="cop">${esc(r.op||'')}</td><td class="cnote">${esc(r.note||'')}${r.action?`<br><small><b>Khắc phục:</b> ${esc(r.action)}</small>`:''}</td><td class="cact" style="white-space:nowrap">${o.status!=='ok'?`<button class="sm" data-act="advice" data-id="${r.id}" title="Gợi ý nguyên nhân & xử trí">💡</button> <button class="sm" data-act="action" data-id="${r.id}" title="Ghi hành động khắc phục">⚑</button> `:''}<button class="sm danger" data-act="delRes" data-id="${r.id}" title="Xóa">✕</button></td><td class="cfl">${esc(fl)}</td></tr>`}).join('');
  return `<div class="card"><h2>Kết quả và sự kiện thiết bị (${items.filter(i=>i.k==='r').length} kết quả${vr?' · '+esc(vr.label):''})</h2>${items.length?`<div class="scroll"><table class="m rt"><tr class="hd"><th>Thời gian</th><th>Mức</th><th>Kết quả</th><th>Đánh giá</th><th>Người TH</th><th>Ghi chú</th><th></th></tr>${rows}</table></div>${items.length>40?`<p><button class="sm" data-act="toggleAll">${UI.showAll?'Thu gọn':'Xem tất cả'}</button></p>`:''}`:'<div class="muted">Chưa có dữ liệu.</div>'}</div>`;
}

/* ---------- nhập kết quả ---------- */
function addRun(fd,form){
  const t=T(form.dataset.test),dtv=fd.get('dt');
  if(!dtv){toast('Chưa chọn ngày giờ');return}
  const ts=new Date(dtv).getTime(),run=dtv.slice(0,10),added=[];
  for(const l of t.levels){
    const raw=fd.get('v_'+l.id);if(raw==null||String(raw).trim()==='')continue;
    let value=raw;
    if(t.type==='quant'){value=num(raw);if(isNaN(value)){toast(`Giá trị “${raw}” của ${l.name} không hợp lệ`);return}}
    added.push({id:uid(),testId:t.id,levelId:l.id,levelName:l.name,run,ts,value,lot:l.lot||'',mean:t.type==='quant'?l.mean:undefined,sd:t.type==='quant'?l.sd:undefined,expected:t.type!=='quant'?l.expected:undefined,tol:t.type!=='quant'?(l.tol||0):undefined,op:fd.get('op')||'',reason:fd.get('reason')||'Thường quy',note:fd.get('note')||'',action:''});
  }
  if(!added.length){toast('Chưa nhập kết quả nào');return}
  S.results.push(...added);save();
  const {out}=evalTest(t),ids=new Set(added.map(r=>r.id));
  const flagged=added.filter(r=>out[r.id].flags.length);
  UI.flash=flagged.length?`<div class="alert ${flagged.some(r=>out[r.id].status==='fail')?'fail':''}"><b>Vừa lưu — cần chú ý:</b> ${flagged.map(r=>`${esc(r.levelName)}: ${esc(out[r.id].flags.join(', '))}`).join(' · ')}<br>${adviceBtn(flagged.flatMap(r=>out[r.id].flags))} <small>Bấm ⚑ ở bảng bên dưới để ghi hành động khắc phục.</small></div>`:`<div class="alert okk"><b>Đã lưu ${added.length} kết quả — tất cả đạt.</b></div>`;
  render();
}

function editTest(id,deviceId){
  const t=id?structuredClone(T(id)):{id:uid(),deviceId:deviceId||UI.deviceId||S.devices[0]?.id,name:'',type:'quant',unit:'',dec:2,tea:{kind:'pct',value:''},rules:{...defaultRules},scale:['Âm tính','Dương tính'],levels:[{id:uid(),name:'Mức 1',lot:'',mean:'',sd:'',expected:'',tol:0}]};
  const hasRes=id&&S.results.some(r=>r.testId===id),old=id?structuredClone(T(id)):null;
  let chgReason='';
  const readForm=()=>{
    const fr=$('#fr');if(fr)chgReason=fr.value;
    t.deviceId=$('#fd').value;t.name=$('#fn').value;t.type=$('#ft').value;
    if(t.type==='quant'){t.unit=$('#fu').value;t.dec=parseInt($('#fdec').value)||0;t.tea={kind:$('#fk').value,value:$('#fv').value};
      t.rules={};Object.keys(defaultRules).forEach(k=>t.rules[k]=$('#r_'+k).checked)}
    else{t.scale=$('#fs').value.split(',').map(s=>s.trim()).filter(Boolean);t.scale=[...new Set(t.scale)]}
    t.levels.forEach((l,i)=>{l.name=$('#ln'+i).value;l.lot=$('#ll'+i).value;
      if(t.type==='quant'){l.mean=$('#lm'+i).value;l.sd=$('#lsd'+i).value}
      else{l.expected=$('#le'+i).value;if(t.type==='semi')l.tol=$('#lt'+i).value}});
  };
  const draw=()=>{
    const q=t.type==='quant';
    const lv=t.levels.map((l,i)=>`<tr><td><input id="ln${i}" value="${esc(l.name)}"></td><td><input id="ll${i}" value="${esc(l.lot)}" placeholder="tuỳ chọn"></td>${q?`<td><input id="lm${i}" inputmode="decimal" value="${esc(l.mean)}"></td><td><input id="lsd${i}" inputmode="decimal" value="${esc(l.sd)}"></td>`:`<td><select id="le${i}">${t.scale.map(s=>`<option ${s===l.expected?'selected':''}>${esc(s)}</option>`).join('')}</select></td>${t.type==='semi'?`<td><input id="lt${i}" inputmode="numeric" value="${esc(l.tol??0)}" style="width:70px"></td>`:''}`}<td><button class="sm danger" data-del="${i}" type="button">✕</button></td></tr>`).join('');
    $('#mb').innerHTML=`<div class="row"><label class="fld"><span>Thiết bị *</span><select id="fd">${S.devices.map(d=>`<option value="${d.id}" ${d.id===t.deviceId?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label><label class="fld" style="flex:2 1 220px"><span>Tên xét nghiệm *</span><input id="fn" value="${esc(t.name)}"></label><label class="fld"><span>Loại</span><select id="ft" ${hasRes?'disabled':''}>${Object.entries(typeName).map(([k,v])=>`<option value="${k}" ${k===t.type?'selected':''}>${v}</option>`).join('')}</select></label></div>
    ${q?`<div class="row" style="margin-top:10px"><label class="fld"><span>Đơn vị</span><input id="fu" value="${esc(t.unit)}" placeholder="mg/dL"></label><label class="fld"><span>Số chữ số thập phân</span><input id="fdec" inputmode="numeric" value="${esc(t.dec)}"></label><label class="fld"><span>TEa (nếu có)</span><div style="display:flex;gap:6px"><input id="fv" inputmode="decimal" value="${esc(t.tea?.value)}" placeholder="vd 10"><select id="fk" style="width:90px"><option value="pct" ${t.tea?.kind==='pct'?'selected':''}>%</option><option value="abs" ${t.tea?.kind==='abs'?'selected':''}>đơn vị</option></select></div></label></div>
    <p style="margin:12px 0 4px;font-size:13px" class="muted">Quy tắc Westgard áp dụng</p><div class="chk">${Object.entries(ruleNames).map(([k,v])=>`<label><input type="checkbox" id="r_${k}" ${t.rules[k]!==false?'checked':''}>${v}</label>`).join('')}</div>`
    :`<label class="fld" style="margin-top:10px"><span>Thang kết quả, sắp xếp từ thấp đến cao, cách nhau bằng dấu phẩy</span><input id="fs" value="${esc(t.scale.join(', '))}" placeholder="Âm tính, ±, 1+, 2+, 3+"></label>`}
    <p style="margin:14px 0 4px;font-size:13px" class="muted">Các mức nội kiểm</p><div class="scroll"><table><tr><th>Tên mức</th><th>Số lô</th>${q?'<th>Mean</th><th>SD</th>':`<th>Kết quả mong đợi</th>${t.type==='semi'?'<th>Sai lệch cho phép (bậc)</th>':''}`}<th></th></tr>${lv}</table></div><p><button type="button" id="addLv" class="sm">＋ Thêm mức</button></p>${hasRes?`<label class="fld" style="margin-top:6px"><span>Lý do thay đổi (ghi chú lên biểu đồ nếu bạn đổi mean, SD, lô…)</span><input id="fr" value="${esc(chgReason)}" placeholder="vd: đổi lô QC, tính lại SD sau 20 điểm"></label><small class="muted">Kết quả cũ giữ nguyên thông số lúc nhập. Biểu đồ vẫn hiện đủ, vạch giới hạn đổi tại điểm thay đổi và có ghi chú “TS”.</small>`:''}`;
    $('#ft').onchange=()=>{readForm();if(t.type!=='quant'&&!t.scale.length)t.scale=['Âm tính','Dương tính'];t.levels.forEach(l=>{if(t.type!=='quant'&&!t.scale.includes(l.expected))l.expected=t.scale[0]});draw()};
    const fs=$('#fs');if(fs)fs.onchange=()=>{readForm();t.levels.forEach(l=>{if(!t.scale.includes(l.expected))l.expected=t.scale[0]});draw()};
    $('#addLv').onclick=()=>{readForm();t.levels.push({id:uid(),name:'Mức '+(t.levels.length+1),lot:'',mean:'',sd:'',expected:t.scale[0]||'',tol:0});draw()};
    $('#mb').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{readForm();t.levels.splice(+b.dataset.del,1);draw()});
  };
  if(!S.devices.length){toast('Hãy thêm thiết bị trước');return}
  modal(id?'Khai báo xét nghiệm':'Thêm xét nghiệm','',()=>{
    readForm();
    t.name=t.name.trim();if(!t.name)return merr('Nhập tên xét nghiệm');
    if(!t.levels.length)return merr('Cần ít nhất một mức nội kiểm');
    for(const l of t.levels){
      l.name=l.name.trim();l.lot=l.lot.trim();if(!l.name)return merr('Mỗi mức cần có tên');
      if(t.type==='quant'){const m=num(l.mean),s=num(l.sd);if(isNaN(m))return merr(`Mean của “${l.name}” không hợp lệ`);if(isNaN(s)||s<=0)return merr(`SD của “${l.name}” phải > 0`);l.mean=m;l.sd=s;delete l.expected;delete l.tol}
      else{if(t.scale.length<2)return merr('Thang kết quả cần ít nhất 2 giá trị');if(!t.scale.includes(l.expected))return merr(`Chọn kết quả mong đợi cho “${l.name}”`);
        l.tol=t.type==='semi'?Math.max(0,parseInt(l.tol)||0):0;delete l.mean;delete l.sd}
    }
    if(t.type==='quant'){const v=num(t.tea.value);t.tea={kind:t.tea.kind,value:isNaN(v)?0:v};delete t.scale}else{delete t.unit;delete t.tea;delete t.rules}
    const ch=hasRes?diffTest(old,t):[];
    if(id){S.tests[S.tests.findIndex(x=>x.id===id)]=t}else S.tests.push(t);
    if(ch.length)S.events.push({id:uid(),deviceId:t.deviceId,testId:t.id,ts:Date.now(),type:'param',op:'',note:ch.join('; ')+(chgReason.trim()?' — '+chgReason.trim():''),reset:false});
    UI.testId=t.id;UI.deviceId=t.deviceId;document.body.classList.remove('menu');save();render();
  });
  draw();
}

/* ---------- gợi ý, hành động khắc phục, sự kiện ---------- */
function defaultReason(t){
  const {res,out}=evalTest(t),last=res[res.length-1];
  const ev=evFor(t).filter(e=>e.type!=='other'&&(!last||e.ts>last.ts)).pop();
  if(ev)return{maint:'Sau bảo trì',calib:'Sau hiệu chuẩn',service:'Sau sửa chữa / thay linh kiện',reagent:'Đổi lô thuốc thử',qclot:'Đổi lô vật liệu QC'}[ev.type];
  if(last&&out[last.id]&&out[last.id].status==='fail')return'Chạy lại sau khắc phục';
  return'Thường quy';
}
const adviceBtn=flags=>{const u=[...new Set(flags)].filter(f=>ADV[advKey(f)]);return u.length?`<button class="sm" data-act="advice" data-flags="${esc(u.join('||'))}">💡 Gợi ý nguyên nhân và xử trí</button>`:''};
function showAdvice(flags){

function ptsStats(t,l,pts){

  if(!n)return{n,fail:0};
  const v=pts.map(p=>p.r.value),mean=v.reduce((a,b)=>a+b,0)/n,sd=n>1?Math.sqrt(v.reduce((a,b)=>a+(b-mean)**2,0)/(n-1)):null;

  const sig=t.tea&&t.tea.kind==='pct'&&t.tea.value>0&&cv&&bias!=null?(t.tea.value-Math.abs(bias))/cv:null;
  return{n,mean,sd,cv,bias,sig,fail:pts.filter(p=>p.o.status==='fail').length};
}

function readCsv(text){

function mapHeaders(rows){
  for(let i=0;i<Math.min(rows.length,6);i++){
    const cm={};let hit=0;
    (rows[i]||[]).forEach((h,ci)=>{const k=nrm(h);if(!k)return;for(const f in HDR)if(cm[f]==null&&HDR[f].includes(k)){cm[f]=ci;hit++;break}});
    if(hit>=3)return{cm,hi:i};
  }
  return null;
}
const parseType=v=>{const x=nrm(v);if(!x)return null;if(x.includes('thang'))return'semi';if(x.includes('luong'))return'quant';if(x.includes('tinh'))return'qual';return undefined};
function parseDT(v){
  if(typeof v==='number'){if(v<20000)return NaN;const d=new Date(Math.round((v-25569)*1440)*60000);return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes()).getTime()}
  const s=String(v).trim();let m;
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})(?:[ T,]+(\d{1,2}):(\d{2})(?::\d{2})?)?$/))return new Date(+m[3],+m[2]-1,+m[1],+(m[4]||8),+(m[5]||0)).getTime();
  if(m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})(?:[ T,]+(\d{1,2}):(\d{2})(?::\d{2})?)?$/))return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||8),+(m[5]||0)).getTime();
  return NaN;
}
const mnum=v=>v===''||v==null?NaN:typeof v==='number'?v:num(v);
const decOf=v=>{const m=String(v).match(/[.,](\d+)/);return m?m[1].length:0};
const splitScale=v=>[...new Set(String(v??'').split(/[,;|]/).map(s=>s.trim()).filter(Boolean))];
function parseTea(v,k){
  if(v===''||v==null)return null;
  const s=String(v),m=s.match(/-?\d+(?:[.,]\d+)?/);if(!m)return null;
  const val=num(m[0]);if(isNaN(val))return null;
  const kk=fold(k);
  const kind=s.includes('%')||kk==='%'||kk.startsWith('pct')||kk.startsWith('phan tram')?'pct':(kk?'abs':(/[a-z]/i.test(s.replace(m[0],''))?'abs':'pct'));
  return{kind,value:val};
}
const mkKey=(tid,lid,ts,val)=>tid+'|'+lid+'|'+Math.round(ts/60000)+'|'+String(val);
const ymd=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};

function buildImport(sheets){
  const C=structuredClone(S);C.events??=[];
  const st={newDev:0,newTest:0,newLv:0,res:0,dup:0,evt:0,evtDup:0,errs:[],used:[],first:null};
  const err=(sh,ln,m)=>st.errs.push(`${sh}, dòng ${ln}: ${m}`);

  const prio={cfg:0,res:1,evt:2};
  for(const sh of sheets){

  for(const p of parts){

    for(let r=hi+1;r<sh.rows.length;r++){
      const row=sh.rows[r]||[],g=f=>cm[f]==null?'':(row[cm[f]]??''),ln=r+1;
      if(!row.some(v=>v!==undefined&&v!==''))continue;
      if(kind==='evt'){evs.push({sh:sh.name,ln,dev:str(g('dev')),ap:str(g('ap')),type:str(g('evt')),ts:parseDT(g('dt')),op:str(g('op')),note:str(g('note')),reset:str(g('reset'))});continue}
      const dev=str(g('dev')),test=str(g('test')),lv=str(g('level'));
      if(!dev||!test||!lv){err(sh.name,ln,'thiếu Thiết bị / Xét nghiệm / Mức');continue}
      const ty=parseType(g('type'));if(ty===undefined){err(sh.name,ln,'Loại xét nghiệm không hợp lệ: '+g('type'));continue}
      const tk=nk(dev)+'|'+nk(test),lk=tk+'|'+nk(lv);
      const tc=tC.get(tk)||{};if(ty)tc.type=ty;setIf(tc,'unit',str(g('unit')));
      const tea=parseTea(g('tea'),g('teak'));if(tea)tc.tea=tea;
      const sc=splitScale(g('scale'));if(sc.length)tc.scale=sc;
      const mean=mnum(g('mean')),sd=mnum(g('sd'));
      if(!isNaN(mean)||!isNaN(sd))tc.dec=Math.max(tc.dec||0,Math.min(4,Math.max(1,decOf(g('mean')),decOf(g('sd')))));
      tC.set(tk,tc);
      const lc=lC.get(lk)||{};setIf(lc,'lot',str(g('lot')));setIf(lc,'mean',mean);setIf(lc,'sd',sd);setIf(lc,'exp',str(g('exp')));setIf(lc,'tol',mnum(g('tol')));lC.set(lk,lc);
      if(kind==='res'){
        const ts=parseDT(g('dt')),raw=g('val');
        if(raw===''){err(sh.name,ln,'thiếu Kết quả');continue}
        if(isNaN(ts)){err(sh.name,ln,'Ngày giờ không hợp lệ: '+g('dt')+' (dùng dd/mm/yyyy hh:mm)');continue}
        items.push({sh:sh.name,ln,dev,test,lv,tk,lk,ts,raw,own:{mean,sd,exp:str(g('exp')),tol:mnum(g('tol')),lot:str(g('lot'))},reason:str(g('reason')),op:str(g('op')),note:str(g('note')),action:str(g('action'))});
      }
    }
  }
  const seen=new Set(C.results.map(r=>mkKey(r.testId,r.levelId,r.ts,r.value)));
  const findDev=n=>C.devices.find(d=>nk(d.name)===nk(n));
  items.forEach(it=>{
    let d=findDev(it.dev),t=d&&C.tests.find(x=>x.deviceId===d.id&&nk(x.name)===nk(it.test));
    const tc=tC.get(it.tk)||{},lc=lC.get(it.lk)||{};
    const numv=typeof it.raw==='number'?it.raw:num(it.raw);
    if(t&&tc.type&&tc.type!==t.type){err(it.sh,it.ln,`Loại "${typeName[tc.type]}" không khớp với xét nghiệm đã có (${typeName[t.type]})`);return}
    const type=t?t.type:(tc.type||(isNaN(numv)?(tc.scale&&tc.scale.length>2?'semi':'qual'):'quant'));
    let lvl=t&&t.levels.find(l=>nk(l.name)===nk(it.lv)),value,rec;

    }else{

  });

}
function importDialog(file){

    let h=`<p class="muted" style="margin-top:0">${st.used.length?'Bảng được đọc: '+esc(st.used.join('; ')):''}</p>`;
    h+=any?`<div class="advbox"><h4>Sẽ thêm vào app</h4>${li([`${st.res} kết quả QC`,`${st.newDev} thiết bị mới, ${st.newTest} xét nghiệm mới, ${st.newLv} mức QC mới`,...(st.evt?[`${st.evt} sự kiện thiết bị`]:[])])}</div>`:'<div class="alert">Không có dữ liệu mới để nhập.</div>';
    if(st.dup||st.evtDup)h+=`<p class="muted">Bỏ qua ${st.dup} kết quả và ${st.evtDup} sự kiện đã có trong app (trùng xét nghiệm, mức, thời gian và giá trị).</p>`;

function periodRange(p){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth();
  if(p==='month')return{from:new Date(y,m,1).getTime(),to:new Date(y,m+1,1).getTime()-1,label:`Tháng ${m+1}/${y}`};
  if(p==='prev'){const d=new Date(y,m-1,1);return{from:d.getTime(),to:new Date(y,m,1).getTime()-1,label:`Tháng ${d.getMonth()+1}/${d.getFullYear()}`}}
  if(p==='30')return{from:Date.now()-30*864e5,to:Date.now(),label:'30 ngày gần nhất'};
  return{from:0,to:Infinity,label:'Toàn bộ dữ liệu'};
}
function groupsOf(res,out){
  const g={};
  res.forEach(r=>{const k=[r.levelId,r.lot||'',r.mean,r.sd,r.expected,r.tol].join('|');
    (g[k]??={level:{id:r.levelId,name:r.levelName,lot:r.lot||'',mean:r.mean,sd:r.sd,expected:r.expected,tol:r.tol},pts:[]}).pts.push({r,o:out[r.id]})});
  return Object.values(g);
}
function reportTest(t,range){
  const d=t.dec??2,{res,out}=evalTest(t),inR=res.filter(r=>r.ts>=range.from&&r.ts<=range.to&&out[r.id]);
  const tea=t.tea&&t.tea.value>0?` · TEa ${t.tea.value}${t.tea.kind==='pct'?'%':' '+esc(t.unit||'')}`:'';
  let h=`<div class="tst"><h2>${esc(D(t.deviceId)?.name||'')} — ${esc(t.name)} <small style="font-weight:400">(${typeName[t.type]}${t.unit?', '+esc(t.unit):''}${tea})</small></h2>`;
  const sum={n:inR.length,ok:0,warn:0,fail:0};inR.forEach(r=>sum[out[r.id].status]++);
  if(!inR.length)return{html:h+'<p class="muted">Không có kết quả trong kỳ báo cáo.</p></div>',sum};
  h+=`<p style="margin:4px 0">${sum.n} kết quả: ${sum.ok} đạt, ${sum.warn} cảnh báo, ${sum.fail} vi phạm.</p>`;
  const gs=groupsOf(inR,out),lgs=levelGroups(inR,out);
  h+=notesHTML(t,lgs);
  if(t.type==='quant'&&lgs.length>=2)h+=`<h3>Tất cả các mức (z-score)</h3>`+zChart(t,lgs);
  lgs.forEach(g=>{
    const l=g.level,sub=t.type==='quant'?`TB ${fmt(l.mean,d)} · SD ${fmt(l.sd,d)}`:`mục tiêu: ${esc(l.expected)}${t.type==='semi'?` (±${l.tol||0} bậc)`:''}`;
    h+=`<h3>${esc(l.name)}${l.lot?' · lô '+esc(l.lot):''} <span class="muted" style="font-weight:400">${sub}</span></h3>`+(t.type==='quant'?ljChart(l,g.pts,t):stepChart(l,g.pts,t));
  });
  const rows=gs.map(g=>{const l=g.level,s=ptsStats(t,l,g.pts);
    return t.type==='quant'?`<tr><td>${esc(l.name)}</td><td>${esc(l.lot)}</td><td>${s.n}</td><td>${fmt(l.mean,d)}</td><td>${fmt(s.mean,d)}</td><td>${fmt(s.sd,d)}</td><td>${fmt(s.cv,1)}%</td><td>${fmt(s.bias,1)}%</td><td>${fmt(s.sig,1)}</td><td>${s.fail}</td></tr>`
      :`<tr><td>${esc(l.name)}</td><td>${esc(l.lot)}</td><td>${esc(l.expected)}</td><td>${s.n}</td><td>${s.pct==null?'–':fmt(s.pct,1)+'%'}</td><td>${s.fail}</td></tr>`}).join('');
  h+=`<h3>Thống kê trong kỳ</h3><div class="scroll"><table>${t.type==='quant'?'<tr><th>Mức</th><th>Lô</th><th>n</th><th>TB mục tiêu</th><th>TB thực tế</th><th>SD thực tế</th><th>CV%</th><th>Bias%</th><th>Sigma</th><th>Vi phạm</th></tr>':'<tr><th>Mức</th><th>Lô</th><th>Mục tiêu</th><th>n</th><th>Tỷ lệ đạt</th><th>Không đạt</th></tr>'}${rows}</table></div>`;
  const bad=inR.filter(r=>out[r.id].flags.length);
  h+=`<h3>Vi phạm / cảnh báo và hành động khắc phục</h3>`+(bad.length?`<div class="scroll"><table><tr><th>Thời gian</th><th>Mức</th><th>Kết quả</th><th>Ghi nhận</th><th>Lý do chạy</th><th>Hành động khắc phục</th></tr>${bad.map(r=>`<tr><td>${fmtDT(r.ts)}</td><td>${esc(r.levelName)}</td><td>${t.type==='quant'?fmt(r.value,d)+' (z '+fmt(out[r.id].z,2)+')':esc(r.value)}</td><td>${esc(out[r.id].flags.join(', '))}</td><td>${esc(r.reason||'Thường quy')}</td><td>${esc(r.action||'')}</td></tr>`).join('')}</table></div>`:'<p class="muted">Không có.</p>');
  const evs=evFor(t).filter(e=>e.ts>=range.from&&e.ts<=range.to);
  if(evs.length)h+=`<h3>Sự kiện thiết bị trong kỳ</h3><div class="scroll"><table><tr><th>Thời gian</th><th>Loại</th><th>Nội dung</th><th>Người thực hiện</th></tr>${evs.map(e=>`<tr><td>${fmtDT(e.ts)}</td><td>${esc(EVT[e.type].n)}</td><td>${esc(e.note||'')}</td><td>${esc(e.op||'')}</td></tr>`).join('')}</table></div>`;
  return{html:h+'</div>',sum};
}
function reportDialog(){
  const t=T(UI.testId);
  if(!S.tests.length){toast('Chưa có xét nghiệm nào');return}
  modal('Báo cáo nội kiểm (in / lưu PDF)',`<div class="row"><label class="fld"><span>Phạm vi</span><select id="rs">${t?`<option value="test">Xét nghiệm đang chọn (${esc(t.name)})</option><option value="device">Tất cả xét nghiệm của ${esc(D(t.deviceId)?.name||'')}</option>`:''}<option value="lab">Toàn phòng (mọi thiết bị)</option></select></label><label class="fld"><span>Thời gian</span><select id="rp"><option value="month">Tháng này</option><option value="prev">Tháng trước</option><option value="30">30 ngày gần nhất</option><option value="all">Tất cả</option></select></label></div><label class="fld" style="margin-top:10px"><span>Tên phòng / đơn vị (hiện ở đầu báo cáo)</span><input id="rl" value="${esc(localStorage.getItem('iqc.lab')||'')}"></label><p class="muted" style="font-size:13px">Báo cáo mở ngay trong app. Bấm “In / Lưu PDF” rồi chọn “Lưu dưới dạng PDF”. Trên điện thoại: Chia sẻ → In → PDF.</p>`,
  ()=>{const lab=$('#rl').value.trim();localStorage.setItem('iqc.lab',lab);openReport($('#rs').value,$('#rp').value,lab)},{saveLabel:'Tạo báo cáo'});
}
function openReport(scope,period,lab){
  const t0=T(UI.testId),range=periodRange(period);
  const order=id=>S.devices.findIndex(d=>d.id===id);
  let tests=scope==='test'&&t0?[t0]:scope==='device'&&t0?S.tests.filter(t=>t.deviceId===t0.deviceId):[...S.tests];
  tests=tests.sort((a,b)=>order(a.deviceId)-order(b.deviceId));
  const keep=UI.lastN,keepSel=UI.sel;UI.lastN=0;UI.sel='n0';
  const parts=tests.map(t=>({t,...reportTest(t,range)}));
  UI.lastN=keep;UI.sel=keepSel;
  const top=parts.length>1?`<h2>Tổng hợp</h2><div class="scroll"><table><tr><th>Thiết bị</th><th>Xét nghiệm</th><th>Số KQ</th><th>Đạt</th><th>Cảnh báo</th><th>Vi phạm</th></tr>${parts.map(p=>`<tr><td>${esc(D(p.t.deviceId)?.name||'')}</td><td>${esc(p.t.name)}</td><td>${p.sum.n}</td><td>${p.sum.ok}</td><td>${p.sum.warn}</td><td>${p.sum.fail}</td></tr>`).join('')}</table></div>`:'';
  const dt=new Date();
  $('#rep').innerHTML=wrapSvg(`<div class="bar"><button class="pri" data-act="repPrint">In / Lưu PDF</button><button data-act="repClose">Đóng</button></div><div class="page"><h1>Báo cáo nội kiểm xét nghiệm</h1><div style="color:#555">${lab?esc(lab)+' · ':''}Kỳ báo cáo: ${esc(range.label)} · Ngày lập: ${pad(dt.getDate())}/${pad(dt.getMonth()+1)}/${dt.getFullYear()}</div>${top}${parts.map(p=>p.html).join('')}<div class="sign"><div>Người lập</div><div>Người phụ trách</div><div>Trưởng khoa / Phê duyệt</div></div><div class="foot"><div>Nội kiểm xét nghiệm (IQC) · Tác giả: <b>Bá Tử Kinh | Tường Vi</b></div><div>© 2026 Bá Tử Kinh | Tường Vi. Bảo lưu mọi quyền.</div></div></div>`);
  $('#rep').classList.add('on');$('#rep').scrollTop=0;
}

/* ---------- GitHub ---------- */
const ghCfg=()=>{try{return JSON.parse(localStorage.getItem(GH)||'{}')}catch(e){return{}}};
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const ghUrl=c=>`https://api.github.com/repos/${c.repo}/contents/${c.path.split('/').map(encodeURIComponent).join('/')}`;
async function ghPull(c){
  const r=await fetch(ghUrl(c)+'?ref='+encodeURIComponent(c.branch),{headers:{Accept:'application/vnd.github.raw+json',...(c.token?{Authorization:'Bearer '+c.token}:{})}});
  if(!r.ok)throw new Error(r.status===404?'không thấy file/repo (404)':'HTTP '+r.status);
  return JSON.parse(await r.text());
}
const setSync=v=>{const c=ghCfg();c.lastSync=v;localStorage.setItem(GH,JSON.stringify(c))};
async function ghPush(c,force){
  const H={Accept:'application/vnd.github+json',Authorization:'Bearer '+c.token};
  if(!force){
    let remote=null;try{remote=await ghPull(c)}catch(e){}
    if(remote&&((c.lastSync!=null&&(remote.updatedAt||0)>c.lastSync)||(c.lastSync==null&&(remote.results||[]).length))){
      const er=new Error(c.lastSync==null?'Máy này chưa từng đồng bộ, nhưng trên GitHub đã có dữ liệu. Nên bấm “Tải từ GitHub” trước.':'Trên GitHub có dữ liệu mới hơn (máy khác vừa cập nhật). Nên bấm “Tải từ GitHub” trước.');
      er.code='CONFLICT';throw er;
    }
  }
  const g=await fetch(ghUrl(c)+'?ref='+encodeURIComponent(c.branch),{headers:H});
  let sha;if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error('HTTP '+g.status);
  const body={message:'Cập nhật dữ liệu nội kiểm '+fmtDT(Date.now()),content:b64(JSON.stringify(S,null,1)),branch:c.branch};if(sha)body.sha=sha;
  const p=await fetch(ghUrl(c),{method:'PUT',headers:H,body:JSON.stringify(body)});
  if(!p.ok){let m='HTTP '+p.status;try{m=(await p.json()).message||m}catch(e){}throw new Error(m)}
  setSync(S.updatedAt||0);
}
async function bootSync(){
  const c=ghCfg();if(!c.repo||!c.token)return;
  try{
    const r=normalize(await ghPull(c)),last=c.lastSync==null?-1:c.lastSync,ru=r.updatedAt||0;
    if(ru<=last)return;
    const dirty=last<0?S.results.length>0:(S.updatedAt||0)>last;
    if(dirty&&!confirm('Dữ liệu trên GitHub mới hơn, và máy này cũng có thay đổi chưa đẩy lên. Tải bản GitHub về? (thay đổi chưa đẩy ở máy này sẽ mất; hãy tải JSON sao lưu trước nếu cần)'))return;
    S=r;setSync(ru);localStorage.setItem(LS,JSON.stringify(S));
    UI.testId=S.tests.find(t=>t.id===UI.testId)?UI.testId:(S.tests[0]?.id||null);render();toast('Đã cập nhật dữ liệu mới từ GitHub');
  }catch(e){}
}

/* ---------- xuất file ---------- */
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function csv(testId){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=[['Thiết bị','Xét nghiệm','Loại','Mức','Lô','Thời gian','Kết quả','Mean','SD','z / độ lệch bậc','Trạng thái','Quy tắc / ghi nhận','Lý do chạy QC','Người thực hiện','Ghi chú','Hành động khắc phục']];
  S.tests.filter(t=>!testId||t.id===testId).forEach(t=>{
    const {res,out}=evalTest(t);
    res.forEach(r=>{const o=out[r.id]||{flags:[],status:'ok'};rows.push([D(t.deviceId)?.name,t.name,typeName[t.type],r.levelName,r.lot,fmtDT(r.ts),r.value,r.mean??'',r.sd??'',t.type==='quant'?fmt(o.z,2):o.dev,{ok:'Đạt',warn:'Cảnh báo',fail:'Vi phạm'}[o.status],o.flags.join('; '),r.reason||'Thường quy',r.op,r.note,r.action])});
  });
  dl('noi-kiem.csv','﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8');
}

/* ---------- sự kiện ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='pick'){UI.testId=id;UI.deviceId=T(id).deviceId;UI.showAll=false;document.body.classList.remove('menu');render();window.scrollTo(0,0)}
  else if(a==='newDevice')editDevice();
  else if(a==='editDevice')editDevice(id);
  else if(a==='newTest')editTest(null,id);
  else if(a==='editTest')editTest(id);
  else if(a==='data')dataDialog();
  else if(a==='xlsx')exportXlsx(id);
  else if(a==='report')reportDialog();
  else if(a==='repPrint')window.print();
  else if(a==='repClose')$('#rep').classList.remove('on');
  else if(a==='dayPrev'||a==='dayNext'||a==='dayToday'){const td=ymd(Date.now());UI.from=a==='dayToday'?td:addDays(UI.from||td,a==='dayPrev'?-1:1);UI.to=UI.from;renderMain()}
  else if(a==='menu'){document.documentElement.style.setProperty('--hh',($('header').offsetHeight)+'px');document.body.classList.toggle('menu')}
  else if(a==='csv')csv(id);
  else if(a==='toggleAll'){UI.showAll=!UI.showAll;render()}
  else if(a==='delTest'){const t=T(id);if(confirm(`Xóa xét nghiệm “${t.name}” và toàn bộ kết quả?`)){S.results=S.results.filter(r=>r.testId!==id);S.events=S.events.filter(e=>e.testId!==id);S.tests=S.tests.filter(x=>x.id!==id);UI.testId=null;save();render()}}
  else if(a==='delRes'){if(confirm('Xóa kết quả này?')){S.results=S.results.filter(r=>r.id!==id);save();render()}}
  else if(a==='action')editAction(id);
  else if(a==='newEvent')editEvent(id);
  else if(a==='delEvt'){if(confirm('Xóa sự kiện này?')){S.events=S.events.filter(e=>e.id!==id);save();render()}}
  else if(a==='advice'){const r=S.results.find(x=>x.id===id);showAdvice(b.dataset.flags?b.dataset.flags.split('||'):(r?evalTest(T(r.testId)).out[r.id].flags:[]))}
});
document.addEventListener('submit',e=>{if(e.target.id==='entryForm'){e.preventDefault();addRun(new FormData(e.target),e.target)}});
document.addEventListener('change',e=>{
  const id=e.target.id,td=ymd(Date.now());
  if(id==='viewSel'){
    const v=e.target.value;UI.sel=v;UI.showAll=false;
    if(v[0]==='n')UI.lastN=parseInt(v.slice(1));
    if(v==='day'){if(!UI.from)UI.from=td;UI.to=UI.from}
    if(v==='custom'){if(!UI.from)UI.from=addDays(td,-6);if(!UI.to)UI.to=td}
    renderMain();
  }else if(id==='vFrom'){
    UI.from=e.target.value;if(UI.sel==='day')UI.to=UI.from;else if(UI.to&&UI.from>UI.to)UI.to=UI.from;renderMain();
  }else if(id==='vTo'){
    UI.to=e.target.value;if(UI.from&&UI.to&&UI.to<UI.from)UI.from=UI.to;renderMain();
  }
});

  if(S.tests.length){UI.testId=S.tests[0].id;UI.deviceId=S.tests[0].deviceId}else document.body.classList.add('menu')

  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
